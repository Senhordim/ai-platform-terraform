name: terraform

on:
  pull_request:
    paths:
      - "modules/**"
      - "envs/**"
      - "stacks/**"
      - "specs/**"
      - ".tflint.hcl"
      - ".checkov.yaml"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "~1.13.0"
  AWS_REGION: sa-east-1

jobs:
  static:
    name: fmt · validate · tflint · checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate (sem backend)
        run: |
          set -euo pipefail
          for dir in envs/dev envs/prd stacks/org-guardrails; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: checkov
        run: |
          pip install --quiet "checkov==3.3.30"
          checkov --config-file .checkov.yaml

  plan:
    name: plan (${{ matrix.stack }})
    needs: static
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC -> role de plan (somente leitura); nenhuma access key
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: envs/dev
            environment: dev
          - stack: envs/prd
            environment: prd
          - stack: stacks/org-guardrails
            environment: org
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-plan-${{ matrix.environment }}-${{ github.run_id }}

      # terraform.tfvars vem de uma variável do environment do GitHub
      # (sem segredos: o arquivo só contém ARNs, IDs e configuração).
      - name: tfvars
        env:
          TFVARS: ${{ vars.TFVARS }}
        run: printf '%s\n' "$TFVARS" > "${{ matrix.stack }}/terraform.tfvars"

      - name: init
        run: |
          terraform -chdir="${{ matrix.stack }}" init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"

      - name: plan
        run: terraform -chdir="${{ matrix.stack }}" plan -lock-timeout=5m -out=tfplan -no-color

      - name: show plan
        run: terraform -chdir="${{ matrix.stack }}" show -no-color tfplan > "${{ runner.temp }}/plan.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: plan-${{ matrix.environment }}
          path: ${{ runner.temp }}/plan.txt
          retention-days: 14
